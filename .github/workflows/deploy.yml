name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t "${{ vars.ECR_BACKEND_URL }}:latest" -t "${{ vars.ECR_BACKEND_URL }}:${{ github.sha }}" ./backend
          docker push "${{ vars.ECR_BACKEND_URL }}:latest"
          docker push "${{ vars.ECR_BACKEND_URL }}:${{ github.sha }}"

      - name: Build and push frontend image
        run: |
          docker build -t "${{ vars.ECR_FRONTEND_URL }}:latest" -t "${{ vars.ECR_FRONTEND_URL }}:${{ github.sha }}" ./frontend
          docker push "${{ vars.ECR_FRONTEND_URL }}:latest"
          docker push "${{ vars.ECR_FRONTEND_URL }}:${{ github.sha }}"

      - name: Redeploy on EC2 via SSM (no SSH needed)
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=["cd /opt/codesimplify && sudo ./redeploy.sh"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ]
