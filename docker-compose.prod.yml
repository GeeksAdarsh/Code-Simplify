# Used on the EC2 instance: builds images from source on the box itself.
# Plain HTTP for now - TLS/domain is handled externally later (e.g. Cloudflare).
# Local testing should use ./docker-compose.yml instead.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "80:3000"
    depends_on:
      - backend
