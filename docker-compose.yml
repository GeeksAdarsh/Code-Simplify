# Local build-and-run for testing the containers before deploying.
# Usage: docker compose up --build
# Frontend: http://localhost:3000  Backend: http://localhost:8080/api/health

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
